<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="monetag" content="ba1bb20d6bae201226998d76db3caff2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Text Unformatter & Quick Word Counter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { margin-top: 0; color: #111; font-size: 24px; }
        textarea { width: 100%; height: 250px; padding: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; resize: vertical; }
        .stats { display: flex; gap: 20px; margin: 15px 0; font-size: 14px; color: #666; font-weight: 500; }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #0070f3; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051bb; }
        button.secondary { background: #eaeaea; color: #333; }
        button.secondary:hover { background: #dcdcdc; }
        .ad-placeholder { margin: 30px 0 0 0; background: #f9f9f9; border: 2px dashed #bbb; padding: 20px; text-align: center; color: #888; font-size: 12px; font-weight: bold; border-radius: 6px; }
     </style>
</head>
<body>

<div class="container">
    <h1>Text Unformatter & Counter</h1>
    <p>Paste your text below to instantly strip formatting, remove double spaces, and count words.</p>
    
    <textarea id="textBox" placeholder="Paste your messy text or document paragraphs here..."></textarea>
    
    <div class="stats">
        <div>Words: <span id="wordCount">0</span></div>
        <div>Characters: <span id="charCount">0</span></div>
        <div>Reading Time: <span id="readTime">0</span> min</div>
    </div>
    
    <div class="button-group">
        <button onclick="cleanText()">Clean Spacing & Spans</button>
        <button class="secondary" onclick="copyText()">Copy Clean Text</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
    </div>

    <!-- FUTURE AD REVENUE BLOCK -->
    <div class="ad-placeholder">
        ADVERTISEMENT DISPLAY SLOT<br>
        (Your Google AdSense / Mediavine Banner Code Goes Here)
    </div>
</div>

<script>
    const textBox = document.getElementById('textBox');

    // Run counters automatically when the user types or pastes
    textBox.addEventListener('input', () => {
        const text = textBox.value;
        
        // Count characters
        document.getElementById('charCount').innerText = text.length;
        
        // Count words accurately
        const words = text.trim().split(/\s+/).filter(item => item).length;
        document.getElementById('wordCount').innerText = words;
        
        // Estimate reading time (average 200 words per minute)
        const time = Math.ceil(words / 200);
        document.getElementById('readTime').innerText = words > 0 ? time : 0;
    });

    // Strip bad spaces, line breaks, and messy text patterns
    function cleanText() {
        let text = textBox.value;
        // Turn multiple spaces/tabs into a single space
        text = text.replace(/[ \t]+/g, ' ');
        // Fix stubborn double line breaks often caused by PDFs
        text = text.replace(/\n\s*\n/g, '\n\n');
        textBox.value = text.trim();
        textBox.dispatchEvent(new Event('input')); // Update stats
    }

    // Copy straight to clipboard
    function copyText() {
        textBox.select();
        document.execCommand('copy');
        alert('Clean text copied to clipboard!');
    }

    // Reset everything
    function clearAll() {
        textBox.value = '';
        textBox.dispatchEvent(new Event('input'));
    }
</script>

</body>
</html>
